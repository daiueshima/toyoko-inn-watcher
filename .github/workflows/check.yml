name: Toyoko Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを読み込む
        uses: actions/checkout@v4

      - name: Pythonを準備する
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 前回の空室状態を読み込む
        uses: actions/cache/restore@v4
        with:
          path: room_state.json
          key: toyoko-room-state-${{ github.run_id }}
          restore-keys: |
            toyoko-room-state-

      - name: 必要なPythonライブラリを入れる
        run: pip install -r requirements.txt

      - name: Chromiumを入れる
        run: playwright install chromium --with-deps

      - name: 空室を確認する
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python check_room.py

      - name: 今回の空室状態を保存する
        if: always()
        uses: actions/cache/save@v4
        with:
          path: room_state.json
          key: toyoko-room-state-${{ github.run_id }}
